server:
  port: 8081
spring:
  application:
    name: livehouse-ticket
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/livehouse_ticket?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  redis:
    host: 127.0.0.1
    port: 6379
    password: 123456
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  rabbitmq:
    host: localhost
    # 消息通信端口 安装完rabbitMQ后有个自带的前端可视化管理UI页面，端口15672，浏览器访问
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 生产者配置
    publisher-confirms: true
    publisher-returns: true
    # 消费者配置
    listener:
      simple:
        # Spring AMQP 框架自动ack/nack ->  消费者方法正常执行结束→自动 ack，方法抛异常→自动 nack
        # 方法正常返回 → 框架 basicAck(deliveryTag, false) → broker 删消息
        # 方法抛异常   → 框架 basicNack(deliveryTag, defaultRequeueRejected) → broker 按 requeue 决定去向
        acknowledge-mode: auto
        # 初始消费者线程数量 ——>  RabbitMQ 的队列模型保证： 一条消息只会投递给一个消费者 。`concurrency: 5` 的含义是容器创建 5 个消费者线程，它们各自从队列里抢不同的消息并行处理——5 条不同消息同时被 5 个线程处理，而不是 1 条消息被 5 个线程抢着处理。
        concurrency: 5
        # 动态扩容的最大数量
        max-concurrency: 10
        # 重试机制及次数
        retry:
          enabled: true
          max-attempts: 3
        # 设置broker（RabbitMQ）默认消息投递规则： false代表消费失败(nack)不重新投递消息入队
        default-requeue-rejected: false
        prefetch: 10
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.livehouse.entity # 别名扫描包
  global-config:
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0
logging:
  charset:
    console: GBK
    file: UTF-8
  level:
    com.livehouse: debug

livehouse:
  pay:
    mock-enabled: true
    wx:
      app-id: ${WX_APPID:wxd2e44c3158c309cb}
      mch-id: ${WX_MCHID:}
      api-v3-key: ${WX_APIV3_KEY:}
      cert-serial-no: ${WX_CERT_SERIAL:}
      private-key-path: ${WX_PRIVATE_KEY_PATH:/opt/cert/apiclient_key.pem}
      platform-cert-path: ${WX_PLATFORM_CERT_PATH:/opt/cert/wechatpay_platform.pem}
      notify-url: ${WX_NOTIFY_URL:https://api.example.com/app/pay/notify/wxpay}
  order:
    pay-timeout-minutes: 15
    service-fee-per-ticket: 6.00
    refund-deadline-days: 7
  credit:
    rate-per-yuan: 0.05
  upload:
    dir: frontend-livehouse/uploads
    url-prefix: /uploads/
  ticket:
    encryption-key: LiveHouse2024SecretKey!@#$%^&*()
  # 高德地图 Web端(JS API) Key：https://console.amap.com/dev/key/app
  # 坐标系使用 GCJ-02，与 tb_venue 经纬度、Redis GEO 一致
  map:
    amap-js-key: ${AMAP_JS_KEY:ddc40069235881db7f635103e27a2d7c}
    # 地理编码请用控制台「Web 服务」类型 Key；未配置时尝试 amap-js-key（但功能可能不可用）
    amap-web-key: ${AMAP_WEB_KEY:844b84942f3c277de9e98302789b3aad}
    geocode-enabled: true
